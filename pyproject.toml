[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trawl"
version = "0.1.0"
description = "Open-source, self-hostable search/extract/crawl API for AI agents with a Tavily-compatible interface."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "trafilatura>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
trawl = "trawl.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trawl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
