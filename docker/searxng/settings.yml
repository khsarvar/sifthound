# Minimal SearXNG config for trawl. Inherits SearXNG defaults; only overrides what the
# API needs: the JSON output format (off by default) and no bot limiter for server-to-server use.
use_default_settings: true

server:
  # Override via SEARXNG_SECRET in docker-compose / environment.
  secret_key: "change-me"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json
